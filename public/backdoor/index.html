 await new Promise(resolve=>{const ready=()=>setTimeout(resolve,0);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});else ready();});
 const html=readerPlaintext;readerPlaintext='';form.reset();document.open();document.write(html);document.close();

async function resume(){const saved=RunographReaderSession.read();if(!saved)return;form.hidden=true;button.disabled=true;try{const result=await reader.handleDecryptionOfPageFromHash(saved.key,false);if(result.isSuccessful){await renderUnlocked();return;}RunographReaderSession.clear();}catch{}form.hidden=false;button.disabled=false;}
form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.textContent='Opening preview…';try{const value=document.getElementById('reader-password').value;const result=await reader.handleDecryptionOfPage(value,false);if(!result.isSuccessful){status.textContent='The password is incorrect.';return;}if(!RunographReaderSession.write({key:result.hashedPassword,expires:Date.now()+readerSessionDuration})){status.textContent='Allow browser storage to continue.';return;}await renderUnlocked();}catch{status.textContent='Could not open the preview. Please try again in a current browser.';}finally{button.disabled=false;}});
resume();
