{
  "media": {
    "input": "public/assets/uploads",
    "output": "/assets/uploads",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp",
      "pdf",
      "txt",
      "csv",
      "zip"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "posts",
      "label": "Journal / Päevik",
      "type": "collection",
      "path": "content/posts",
      "format": "json",
      "filename": "{fields.slug}.json",
      "subfolders": false,
      "view": {
        "primary": "en.title",
        "fields": [
          "en.title",
          "status",
          "date"
        ],
        "sort": "date",
        "order": "desc"
      },
      "fields": [
        {
          "name": "slug",
          "label": "URL slug (lowercase, hyphens)",
          "type": "string",
          "required": true
        },
        {
          "name": "status",
          "label": "Status / Olek",
          "type": "select",
          "default": "draft",
          "options": {
            "values": [
              "draft",
              "published"
            ]
          },
          "required": true
        },
        {
          "name": "date",
          "label": "Publication date / Kuupäev",
          "type": "date",
          "options": {
            "format": "yyyy-MM-dd"
          },
          "required": true
        },
        {
          "name": "countries",
          "type": "reference",
          "label": "Riigid / Countries (mitu valikut; tühi = Üldine)",
          "options": {
            "collection": "countries",
            "value": "{fields.slug}",
            "label": "{en.name}",
            "search": "en.name,slug",
            "multiple": true
          },
          "description": "Vali kõik riigid, mida lugu puudutab. Näiteks Prantsusmaa ja Monaco. / Select all countries covered by this story."
        },
        {
          "name": "placeNames",
          "label": "Cities, villages and places",
          "type": "string",
          "list": {
            "max": 30
          },
          "options": {
            "maxlength": 120
          },
          "description": "Add each place name as a separate tag, for example Benissa, Moraira and Fanadix. You can add new names directly here; no place setup is needed. Only published stories contribute to public place lists."
        },
        {
          "name": "image",
          "label": "Cover image / Kaanepilt",
          "type": "image"
        },
        {
          "name": "attachments",
          "label": "Failid / Attachments",
          "type": "file",
          "options": {
            "extensions": [
              "pdf",
              "txt",
              "csv",
              "zip"
            ],
            "multiple": {
              "max": 10
            },
            "unique": true,
            "rename": "safe"
          },
          "description": "PDF, TXT, CSV or ZIP. Prepared GPX downloads are added automatically after the score; original activity exports are not uploaded."
        },
        {
          "name": "coverFit",
          "label": "Kaanepildi kuvamine / Cover image display",
          "type": "select",
          "default": "cover",
          "options": {
            "values": [
              {
                "value": "cover",
                "label": "Täida ala / Fill"
              },
              {
                "value": "contain",
                "label": "Näita tervet pilti / Show full photo"
              }
            ]
          }
        },
        {
          "name": "routeMap",
          "label": "Loo kaart / Story map",
          "type": "object",
          "fields": [
            {
              "name": "enabled",
              "label": "Näita kaarti / Show map",
              "type": "boolean",
              "default": false
            },
            {
              "name": "googleMyMapsUrl",
              "label": "Google My Mapsi link / Google My Maps link",
              "type": "string",
              "description": "Kleebi siia oma avaliku Google My Mapsi kaardi jagamislink. Kaart avaneb loos automaatselt. / Paste the sharing link of your public Google My Maps map. It opens automatically in the story. Leave blank to use a prepared map below."
            },
            {
              "name": "mapId",
              "label": "Ettevalmistatud kaart / Prepared map",
              "type": "select",
              "options": {
                "values": [
                  {
                    "value": "nice-to-monaco",
                    "label": "Nice to Monaco"
                  },
                  {
                    "value": "benissa-moraira-fanadix",
                    "label": "Benissa, Moraira and Fanadix"
                  },
                  {
                    "value": "barcelona",
                    "label": "Barcelona + seafront"
                  },
                  {
                    "value": "castellon",
                    "label": "Castellón marathon"
                  },
                  {
                    "value": "seville",
                    "label": "Seville marathon"
                  }
                ]
              },
              "description": "Kaardid avanevad automaatselt. Starti ega finišit eraldi ei märgita. / Maps open automatically without start or finish markers."
            },
            {
              "name": "downloadsEnabled",
              "label": "Show prepared GPX downloads",
              "type": "boolean",
              "default": true,
              "description": "Prepared routes contain coordinates and elevation only, without timestamps or training data. Downloads appear after the score."
            }
          ]
        },
        {
          "name": "ratings",
          "label": "Runographi hinnang / Story score",
          "type": "object",
          "fields": [
            {
              "name": "enabled",
              "label": "Näita hinnangut / Show rating",
              "type": "boolean",
              "default": false
            },
            {
              "name": "safety",
              "label": "Ohutus / Safety",
              "type": "object",
              "fields": [
                {
                  "name": "score",
                  "label": "Hinne 1 kuni 10 / Score 1 to 10",
                  "type": "number",
                  "options": {
                    "min": 1,
                    "max": 10
                  }
                },
                {
                  "name": "en",
                  "label": "Short note in English",
                  "type": "text",
                  "description": "Kuni 240 märki, soovi korral. / Optional, up to 240 characters."
                }
              ]
            },
            {
              "name": "scenery",
              "label": "Vaated / Scenery",
              "type": "object",
              "fields": [
                {
                  "name": "score",
                  "label": "Hinne 1 kuni 10 / Score 1 to 10",
                  "type": "number",
                  "options": {
                    "min": 1,
                    "max": 10
                  }
                },
                {
                  "name": "en",
                  "label": "Short note in English",
                  "type": "text",
                  "description": "Kuni 240 märki, soovi korral. / Optional, up to 240 characters."
                }
              ]
            },
            {
              "name": "surface",
              "label": "Rajapind / Running surface",
              "type": "object",
              "fields": [
                {
                  "name": "score",
                  "label": "Hinne 1 kuni 10 / Score 1 to 10",
                  "type": "number",
                  "options": {
                    "min": 1,
                    "max": 10
                  }
                },
                {
                  "name": "en",
                  "label": "Short note in English",
                  "type": "text",
                  "description": "Kuni 240 märki, soovi korral. / Optional, up to 240 characters."
                }
              ]
            },
            {
              "name": "access",
              "label": "Ligipääsetavus / Access",
              "type": "object",
              "fields": [
                {
                  "name": "score",
                  "label": "Hinne 1 kuni 10 / Score 1 to 10",
                  "type": "number",
                  "options": {
                    "min": 1,
                    "max": 10
                  }
                },
                {
                  "name": "en",
                  "label": "Short note in English",
                  "type": "text",
                  "description": "Kuni 240 märki, soovi korral. / Optional, up to 240 characters."
                }
              ]
            },
            {
              "name": "experience",
              "label": "Jooksuelamus / Running experience",
              "type": "object",
              "fields": [
                {
                  "name": "score",
                  "label": "Hinne 1 kuni 10 / Score 1 to 10",
                  "type": "number",
                  "options": {
                    "min": 1,
                    "max": 10
                  }
                },
                {
                  "name": "en",
                  "label": "Short note in English",
                  "type": "text",
                  "description": "Kuni 240 märki, soovi korral. / Optional, up to 240 characters."
                }
              ]
            }
          ],
          "description": "Sisesta kõik viis hinnet 1 kuni 10 ning soovi korral lühikommentaarid. Lülita Näita hinnangut sisse. Keskmine arvutatakse automaatselt ja kuvatakse loo lõpus. / Enter five scores from 1 to 10 and optional short notes. Enable Show rating; the average is calculated automatically on the story page."
        },
        {
          "name": "en",
          "label": "English original",
          "type": "object",
          "fields": [
            {
              "name": "title",
              "label": "Title / Pealkiri",
              "type": "string"
            },
            {
              "name": "excerpt",
              "label": "Introduction / Sissejuhatus",
              "type": "text"
            },
            {
              "name": "body",
              "label": "Story / Sisu",
              "type": "rich-text",
              "options": {
                "format": "markdown",
                "switcher": true,
                "extensions": [
                  "jpg",
                  "jpeg",
                  "png",
                  "webp"
                ],
                "rename": "safe"
              }
            },
            {
              "name": "imageAlt",
              "type": "string",
              "label": "Image description (alt) / Pildi kirjeldus"
            },
            {
              "name": "imageCaption",
              "type": "string",
              "label": "Image caption / Pildiallkiri"
            },
            {
              "name": "seoTitle",
              "type": "string",
              "label": "SEO title, optional / SEO pealkiri"
            },
            {
              "name": "seoDescription",
              "type": "text",
              "label": "Meta description, optional / Meta kirjeldus"
            },
            {
              "name": "socialImage",
              "type": "image",
              "label": "Sharing image, optional / Jagamispilt"
            }
          ],
          "description": "Write the original story in English. Complete its title, introduction and body before publishing."
        },
        {
          "name": "translations",
          "label": "Add translations / Lisa tõlge",
          "type": "object",
          "list": {
            "max": 25,
            "collapsible": {
              "collapsed": true,
              "summary": "{language} · {status}"
            }
          },
          "description": "Add an item, choose its language and write the translation. Keep Draft while writing; only Published translations receive a language badge. Photos, maps and scores are shared. Add each language once.",
          "fields": [
            {
              "name": "language",
              "label": "Translation language",
              "type": "select",
              "required": true,
              "options": {
                "values": [
                  {
                    "value": "es",
                    "label": "Spanish"
                  },
                  {
                    "value": "fr",
                    "label": "French"
                  },
                  {
                    "value": "pt",
                    "label": "Portuguese"
                  },
                  {
                    "value": "it",
                    "label": "Italian"
                  },
                  {
                    "value": "de",
                    "label": "German"
                  },
                  {
                    "value": "nl",
                    "label": "Dutch"
                  },
                  {
                    "value": "et",
                    "label": "Estonian"
                  },
                  {
                    "value": "lv",
                    "label": "Latvian"
                  },
                  {
                    "value": "lt",
                    "label": "Lithuanian"
                  },
                  {
                    "value": "hr",
                    "label": "Croatian"
                  },
                  {
                    "value": "sr",
                    "label": "Serbian"
                  },
                  {
                    "value": "cnr",
                    "label": "Montenegrin"
                  },
                  {
                    "value": "cs",
                    "label": "Czech"
                  },
                  {
                    "value": "el",
                    "label": "Greek"
                  },
                  {
                    "value": "uk",
                    "label": "Ukrainian"
                  },
                  {
                    "value": "tr",
                    "label": "Turkish"
                  },
                  {
                    "value": "th",
                    "label": "Thai"
                  },
                  {
                    "value": "id",
                    "label": "Indonesian"
                  },
                  {
                    "value": "ms",
                    "label": "Malay"
                  },
                  {
                    "value": "ca",
                    "label": "Catalan"
                  },
                  {
                    "value": "pl",
                    "label": "Polish"
                  },
                  {
                    "value": "ru",
                    "label": "Russian"
                  },
                  {
                    "value": "ja",
                    "label": "Japanese"
                  },
                  {
                    "value": "ko",
                    "label": "Korean"
                  },
                  {
                    "value": "zh",
                    "label": "Chinese"
                  }
                ]
              }
            },
            {
              "name": "status",
              "label": "Translation status",
              "type": "select",
              "required": true,
              "default": "draft",
              "options": {
                "values": [
                  "draft",
                  "published"
                ]
              }
            },
            {
              "name": "title",
              "label": "Title / Pealkiri",
              "type": "string"
            },
            {
              "name": "excerpt",
              "label": "Introduction / Sissejuhatus",
              "type": "text"
            },
            {
              "name": "body",
              "label": "Story / Sisu",
              "type": "rich-text",
              "options": {
                "format": "markdown",
                "switcher": true,
                "extensions": [
                  "jpg",
                  "jpeg",
                  "png",
                  "webp"
                ],
                "rename": "safe"
              }
            },
            {
              "name": "imageAlt",
              "type": "string",
              "label": "Image description (alt) / Pildi kirjeldus"
            },
            {
              "name": "imageCaption",
              "type": "string",
              "label": "Image caption / Pildiallkiri"
            },
            {
              "name": "seoTitle",
              "type": "string",
              "label": "SEO title, optional / SEO pealkiri"
            },
            {
              "name": "seoDescription",
              "type": "text",
              "label": "Meta description, optional / Meta kirjeldus"
            },
            {
              "name": "socialImage",
              "type": "image",
              "label": "Sharing image, optional / Jagamispilt"
            }
          ]
        }
      ]
    },
    {
      "name": "site",
      "label": "Site & my story / Leht ja minu lugu",
      "type": "file",
      "path": "content/site.json",
      "format": "json",
      "fields": [
        {
          "name": "brand",
          "label": "Site name / Lehe nimi",
          "type": "string",
          "required": true
        },
        {
          "name": "en",
          "label": "English",
          "type": "object",
          "fields": [
            {
              "name": "tagline",
              "label": "Tagline / Alapealkiri",
              "type": "string",
              "required": true
            },
            {
              "name": "hero",
              "label": "Homepage headline / Avalehe pealkiri",
              "type": "text",
              "required": true
            },
            {
              "name": "intro",
              "label": "Introduction / Sissejuhatus",
              "type": "text",
              "required": true
            },
            {
              "name": "aboutTitle",
              "label": "My story headline / Minu loo pealkiri",
              "type": "text",
              "required": true
            },
            {
              "name": "aboutExcerpt",
              "label": "My story introduction / Sissejuhatus",
              "type": "text",
              "required": true
            },
            {
              "name": "aboutBody",
              "label": "My story (Markdown) / Minu lugu",
              "type": "text",
              "required": true
            }
          ]
        }
      ]
    },
    {
      "name": "branding",
      "label": "Logo & sponsors / Logo ja toetajad",
      "type": "file",
      "path": "content/branding.json",
      "format": "json",
      "fields": [
        {
          "name": "logo",
          "type": "image",
          "label": "Header logo / Päise logo"
        },
        {
          "name": "footerLogo",
          "type": "image",
          "label": "Footer logo, optional / Jaluse logo"
        },
        {
          "name": "logoAlt",
          "type": "string",
          "label": "Logo description / Logo kirjeldus"
        },
        {
          "name": "logoWidth",
          "type": "number",
          "label": "Logo width (80-240 px)",
          "required": true,
          "default": 160,
          "options": {
            "min": 80,
            "max": 240
          }
        },
        {
          "name": "sponsorsEnabled",
          "type": "boolean",
          "label": "Show sponsors / Näita toetajaid",
          "default": true
        },
        {
          "name": "sponsorTitle",
          "type": "object",
          "label": "Sponsor headings / Pealkirjad",
          "fields": [
            {
              "name": "en",
              "type": "string",
              "label": "English",
              "required": true
            }
          ]
        },
        {
          "name": "sponsors",
          "type": "object",
          "label": "Sponsors / Toetajad",
          "list": true,
          "fields": [
            {
              "name": "name",
              "type": "string",
              "label": "Sponsor name / Toetaja nimi"
            },
            {
              "name": "logo",
              "type": "image",
              "label": "Sponsor logo / Toetaja logo"
            },
            {
              "name": "url",
              "type": "string",
              "label": "Website (https://), optional / Veebileht"
            },
            {
              "name": "enabled",
              "type": "boolean",
              "label": "Visible / Nähtav",
              "default": true
            }
          ]
        }
      ]
    },
    {
