{
  "media": {
    "input": "public/assets/uploads",
    "output": "/assets/uploads",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "posts",
      "label": "Journal / Päevik",
      "type": "collection",
      "path": "content/posts",
      "format": "json",
      "filename": "{fields.slug}.json",
      "subfolders": false,
      "view": {
        "primary": "en.title",
        "fields": [
          "en.title",
          "status",
          "date"
        ],
        "sort": "date",
        "order": "desc"
      },
      "fields": [
        {
          "name": "slug",
          "label": "URL slug (lowercase, hyphens)",
          "type": "string",
          "required": true
        },
        {
          "name": "status",
          "label": "Status / Olek",
          "type": "select",
          "default": "draft",
          "options": {
            "values": [
              "draft",
              "published"
            ]
          },
          "required": true
        },
        {
          "name": "date",
          "label": "Publication date / Kuupäev",
          "type": "date",
          "options": {
            "format": "yyyy-MM-dd"
          },
          "required": true
        },
        {
          "name": "country",
          "type": "reference",
          "label": "Riik / Country (optional; empty = General)",
          "options": {
            "collection": "countries",
            "value": "{fields.slug}",
            "label": "{et.name} / {en.name}",
            "search": "en.name,et.name,slug"
          }
        },
        {
          "name": "place",
          "label": "Jooksukoht, soovi korral / Running place, optional",
          "type": "reference",
          "options": {
            "collection": "places",
            "value": "{fields.slug}",
            "label": "{et.name} / {en.name}",
            "search": "et.name"
          }
        },
        {
          "name": "image",
          "label": "Cover image / Kaanepilt",
          "type": "image"
        },
        {
          "name": "en",
          "label": "English",
          "type": "object",
          "fields": [
            {
              "name": "title",
              "label": "Title / Pealkiri",
              "type": "string"
            },
            {
              "name": "excerpt",
              "label": "Introduction / Sissejuhatus",
              "type": "text"
            },
            {
              "name": "body",
              "label": "Body (Markdown) / Sisu",
              "type": "text"
            },
            {
              "name": "imageAlt",
              "type": "string",
              "label": "Image description (alt) / Pildi kirjeldus"
            },
            {
              "name": "imageCaption",
              "type": "string",
              "label": "Image caption / Pildiallkiri"
