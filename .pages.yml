    {
      "name": "countries",
      "label": "Riigid / Countries",
      "type": "collection",
      "path": "content/countries",
      "format": "json",
      "filename": "{fields.slug}.json",
      "subfolders": false,
      "operations": {
        "delete": false,
        "rename": false
      },
      "view": {
        "primary": "et.name",
        "fields": [
          "et.name",
          "en.name",
          "slug"
        ],
        "sort": "et.name",
        "order": "asc"
      },
      "fields": [
        {
          "name": "slug",
          "type": "string",
          "label": "Country URL (e.g. indonesia)",
          "required": true
        },
        {
          "name": "coverImage",
          "label": "Destination cover image",
          "type": "image",
          "description": "Optional country-card photograph, independent of a story’s cover. Leave empty to use the latest published story or the Coming soon image."
        },
        {
          "name": "en",
          "type": "object",
          "label": "English",
          "fields": [
            {
              "name": "name",
              "type": "string",
              "label": "Country name / Riigi nimi",
              "required": true
            },
            {
              "name": "description",
              "type": "text",
              "label": "Introduction, optional / Sissejuhatus"
            }
          ]
        }
      ]
    },
    {
