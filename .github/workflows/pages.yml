name: Publish Runograph
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BUILD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build public website
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Check content and internal links
        run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CHECK_PUBLIC_SEARCH: '1'
      - name: Build and verify encrypted reader preview
        run: node scripts/build-backdoor.mjs && node scripts/check-backdoor.mjs
        env:
          READER_PREVIEW_PASSWORD: ${{ secrets.READER_PREVIEW_PASSWORD }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
