<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><meta name="theme-color" content="#263b2e"><title>Reader preview | Runograph</title><link rel="icon" href="@@BASE@@/assets/favicon-run.svg"><style>
@font-face{font-family:DM;src:url('@@BASE@@/assets/dm-sans-400.ttf')}@font-face{font-family:DM;src:url('@@BASE@@/assets/dm-sans-600.ttf');font-weight:600}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f7f6ee;color:#263b2e;font-family:DM,system-ui,sans-serif;display:flex;flex-direction:column}header{padding:25px clamp(24px,5vw,80px);border-bottom:1px solid #d9ddd2}.brand{color:inherit;text-decoration:none;font-size:29px;font-weight:600;letter-spacing:-1.2px}.brand span{color:#64745c}main{width:min(100% - 48px,420px);margin:auto;padding:64px 0}h1{font-size:clamp(36px,7vw,48px);letter-spacing:-1.6px;line-height:1.1;margin:0 0 15px}p{color:#61705c;line-height:1.6;margin:0 0 30px}label{display:block;font-size:14px;font-weight:600;margin:20px 0 8px}input,button{font:inherit;width:100%;border:1px solid #b7c1b0;border-radius:3px;padding:13px 14px}input{background:#fff;color:#263b2e}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #819372;outline-offset:3px}button{background:#263b2e;color:#f7f6ee;font-weight:600;cursor:pointer;margin-top:24px}button:disabled{opacity:.7;cursor:wait}.status{font-size:14px;min-height:24px;margin:16px 0 0;color:#8a3e29}.note{font-size:12px;margin:12px 0 0}footer{font-size:12px;padding:20px 24px;text-align:center;color:#61705c}noscript{display:block;color:#8a3e29;margin-bottom:16px}
</style></head><body data-reader-gate><header><a class="brand" href="@@BASE@@/">Run<span>ograph</span></a></header><main><h1>A little preview.</h1><p>Sign in to read Runograph before launch.</p><noscript>JavaScript is needed to unlock this preview.</noscript><form id="reader-login"><label for="reader-user">Username</label><input id="reader-user" name="username" autocomplete="username" required spellcheck="false" autocapitalize="none"><label for="reader-password">Password</label><input id="reader-password" name="password" type="password" autocomplete="current-password" required><button type="submit">Start reading</button><p id="reader-status" class="status" role="status" aria-live="polite"></p><p class="note">Signed in across this browser, for up to 12 hours.</p></form></main><footer>Runograph · Reader preview</footer><script>
@@SESSION_HELPERS@@
const readerInitiator=@@CRYPT@@;
const readerConfig=@@CONFIG@@;
const readerSessionKey=@@SESSION_KEY@@;
const readerSessionDuration=@@SESSION_DURATION@@;
let readerPlaintext='';
const reader=readerInitiator.init(readerConfig,{replaceHtmlCallback:html=>{readerPlaintext=html;}});
const form=document.getElementById('reader-login'),status=document.getElementById('reader-status'),button=form.querySelector('button');
async function renderUnlocked(){
 // document.open() is ignored while the original parser is executing. Resume can decrypt before that parser finishes.
 // Wait for parsing, then replace from a separate task so the login DOM and its global styles are removed together.
 await new Promise(resolve=>{const ready=()=>setTimeout(resolve,0);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});else ready();});
 const html=readerPlaintext;readerPlaintext='';form.reset();document.open();document.write(html);document.close();
}
async function resume(){const saved=RunographReaderSession.read();if(!saved)return;form.hidden=true;button.disabled=true;try{const result=await reader.handleDecryptionOfPageFromHash(saved.key,false);if(result.isSuccessful){await renderUnlocked();return;}RunographReaderSession.clear();}catch{}form.hidden=false;button.disabled=false;}
form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.textContent='Opening preview…';try{const value=JSON.stringify([document.getElementById('reader-user').value.trim(),document.getElementById('reader-password').value]);const result=await reader.handleDecryptionOfPage(value,false);if(!result.isSuccessful){status.textContent='The username or password is incorrect.';return;}if(!RunographReaderSession.write({key:result.hashedPassword,expires:Date.now()+readerSessionDuration})){status.textContent='Allow browser storage to continue.';return;}await renderUnlocked();}catch{status.textContent='Could not open the preview. Please try again in a current browser.';}finally{button.disabled=false;}});
resume();
</script></body></html>
